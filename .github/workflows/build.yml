name: Build QR Attendance APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate app files
        run: |
          mkdir -p www
          for f in index.html style.css app.js roster.js; do
            P=$(find . -path ./node_modules -prune -o -path ./www -prune -o -name "$f" -type f -print | head -n 1)
            if [ -z "$P" ]; then
              echo "ERROR: $f not found in repo. Files present:"
              find . -path ./.git -prune -o -type f -print
              exit 1
            fi
            echo "Found $f at $P"
            cp "$P" www/
          done

      - name: Extract App Name from HTML Title
        run: |
          RAW_TITLE=$(grep -oP '(?<=<title>).*?(?=</title>)' www/index.html || echo "QR Attendance")
          CLEAN_APP_NAME=$(echo "$RAW_TITLE" | sed 's/[^a-zA-Z0-9 ]//g' | xargs)
          CLEAN_FILE_NAME=$(echo "$CLEAN_APP_NAME" | sed 's/ /_/g')
          if [ -z "$CLEAN_APP_NAME" ]; then
            CLEAN_APP_NAME="QR Attendance"
            CLEAN_FILE_NAME="QR_Attendance"
          fi
          echo "APP_NAME=$CLEAN_APP_NAME" >> $GITHUB_ENV
          echo "FILE_NAME=$CLEAN_FILE_NAME" >> $GITHUB_ENV

      - name: Configure Capacitor
        run: |
          rm -f package.json package-lock.json capacitor.config.json
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install @capacitor/filesystem @capacitor/share
          npm install jsqr pdfjs-dist@3.11.174
          npm install @capacitor/assets --save-dev
          cp node_modules/jsqr/dist/jsQR.js www/jsQR.js
          cp node_modules/pdfjs-dist/build/pdf.min.js www/pdf.min.js
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/pdf.worker.min.js
          echo "{\"appId\": \"org.evc.qrattendance\", \"appName\": \"$APP_NAME\", \"webDir\": \"www\", \"backgroundColor\": \"#070b18\"}" > capacitor.config.json
          npx cap add android

      - name: Generate App Icons
        run: |
          if [ -f "resources/icon.png" ]; then
            npx capacitor-assets generate --android
          else
            echo "No custom icon found at resources/icon.png, using default Capacitor icon."
          fi

      - name: Add camera permission and lock portrait
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' $M
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' $M

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk ./"$FILE_NAME".apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.FILE_NAME }}-apk"
          path: "./${{ env.FILE_NAME }}.apk"
